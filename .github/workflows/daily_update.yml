name: Daily Stock Data Update

# Runs the ingestion + anomaly scan every weekday after US markets close,
# then commits the updated database back to the repo. Since the Streamlit
# Cloud app reads data/prices.db directly from this repo, this is what
# makes the whole pipeline "run itself" once deployed - no local machine
# needs to be on.

on:
  schedule:
    # 21:30 UTC = 4:30pm ET (just after NYSE close at 4pm ET), Mon-Fri
    - cron: "30 21 * * 1-5"
  workflow_dispatch:  # lets you trigger it manually from the Actions tab too

permissions:
  contents: write  # needed to commit the updated database back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest prices
        working-directory: scripts
        run: python fetch_prices.py

      - name: Scan for anomalies
        working-directory: scripts
        run: python scan_alerts.py

      - name: Commit updated database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated daily data update"
          file_pattern: "data/*.db"
